<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Localizador de Livros</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div id="app" class="w-full max-w-6xl">
    <div id="app-container" class="bg-white rounded-2xl shadow-xl p-6">
      <!-- Conteúdo injetado pelo JS -->
    </div>
  </div>

  <!-- Modal -->
  <div id="modal-overlay" class="fixed inset-0 bg-black bg-opacity-60 hidden items-center justify-center z-50">
    <div id="modal-content" class="bg-white rounded-lg shadow-lg p-6 w-full max-w-md"></div>
  </div>

  <!-- JS -->
  <script src="app.js"></script>
</body>
</html>
